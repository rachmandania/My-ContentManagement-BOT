name: Generate YouTube Video

on:
   schedule:
     - cron: '0 9 * * *'
     - cron: '0 19 * * *'
   workflow_dispatch: 

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install moviepy requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Notify Discord (Start)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_notify.py start

      - name: Run Video Generator
        run: python main.py 2> >(tee error.log >&2)

      - name: Notify Discord (Success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_notify.py success

      - name: Run YouTube Upload
        if: success()
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python youtube_upload.py

        name: Run TikTok Upload
        if: success()
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python tiktok_upload.py "vertical_short.mp4" "Daily Automated Video #fyp #shorts"

      - name: Notify Discord (Uploaded)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_notify.py uploaded

      - name: Notify Discord (Error)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_notify.py error

      - name: Save Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Videos
          path: |
            horizontal_short.mp4
            vertical_short.mp4
