name: Generate YouTube Video

on:
  workflow_dispatch:  # This gives you a button to run it manually

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg (Required for MoviePy)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Notify Discord (Start)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_notify.py start

      - name: Run Video Generator
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        # This bash command runs your script and saves any crash data to 'error.log'
        run: python main.py 2> >(tee error.log >&2)

      - name: Notify Discord (Success)
        if: success()  # GitHub only runs this if main.py finished perfectly
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_notify.py success

      - name: Notify Discord (Error)
        if: failure()  # GitHub only runs this if main.py crashed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_notify.py error

      - name: Save Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Videos
          path: |
            horizontal_short.mp4
            vertical_short.mp4
